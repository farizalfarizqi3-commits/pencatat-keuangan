<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--serif:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

--hdcloud:radial-gradient(circle at 30px 30px,#fff 0 17px,transparent 18px),radial-gradient(circle at 62px 22px,#fff 0 22px,transparent 23px),radial-gradient(circle at 98px 31px,#fff 0 16px,transparent 17px),linear-gradient(#fff,#fff) 14px 30px/96px 17px no-repeat;--cloudop:.85;
--s1:#FFF2B2;--s2:#DCE9F7;--s4:#EAF1FA;--stin:#FFE08A;--stout:#C4D8EF;--glass2:rgba(255,255,255,.38);--pillbg:rgba(255,255,255,.78);--warnbg:#FFE9A8;--warntx:#5B4200;--btnx:#fff;--t-utang:#C4573A;--t-piutang:#3F8A5A;--t-tagihan:#C98A0B;--t-tabungan:#3D6AA5;--t-investasi:#7B6FC0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;

--out:#F0A98A;--in:#8FD0A4;--outbg:rgba(240,169,138,.16);--inbg:rgba(143,208,164,.16);--line:rgba(255,255,255,.08);
--sh:0 4px 14px rgba(0,0,0,.3);--navsh:0 8px 24px rgba(0,0,0,.45);--desk:#0C1220;--segbg:#25304D;--sumbg:linear-gradient(135deg,#3A3720,#4A4424);
--hdbg:linear-gradient(180deg,#141D36 0%,#1D2B4D 52%,#2B3C66 100%);--hdtxt:#F4F6FC;--hdsub:#B3C2E0;--hdglass:rgba(255,255,255,.12);
--pillon:#FFE08A;--pillontxt:#243B5E;
--hdsun:radial-gradient(circle at 38% 38%,#FFFBE0 0 40%,#FFF2B2 41%);--hdring:0 0 0 10px rgba(255,242,178,.12),0 0 0 22px rgba(255,242,178,.06);
--hdcloud:radial-gradient(circle at 20px 18px,#fff 0 1.3px,transparent 1.8px),radial-gradient(circle at 70px 44px,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 110px 12px,#fff 0 1.4px,transparent 1.9px),radial-gradient(circle at 150px 38px,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 40px 70px,#fff 0 1.1px,transparent 1.6px);--cloudop:.7;
--s1:#332F1C;--s2:#1F2C4A;--s4:#19233D;--stin:#3E3A1F;--stout:#243556;--glass2:rgba(255,255,255,.06);--pillbg:rgba(255,255,255,.09);--warnbg:#3E3A1F;--warntx:#FFE08A;--btnx:#2A1710;--t-utang:#F0A98A;--t-piutang:#8FD0A4;--t-tagihan:#F2C14E;--t-tabungan:#8FB5E2;--t-investasi:#B9A7E0}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#131A2B;--paper:#1C2641;--card:#1C2641;--fg:#EEF2FA;--mut:#9DAECF;--b:#7FA8D6;--on:#4A78B5;--bl:#2D3D63;--bt:#25345A;--soft:#3C3820;--sun:#FFE08A;
--out:#F0A98A;--in:#8FD0A4;--outbg:rgba(240,169,138,.16);--inbg:rgba(143,208,164,.16);--line:rgba(255,255,255,.08);
--sh:0 4px 14px rgba(0,0,0,.3);--navsh:0 8px 24px rgba(0,0,0,.45);--desk:#0C1220;--segbg:#25304D;--sumbg:linear-gradient(135deg,#3A3720,#4A4424);
--hdbg:linear-gradient(180deg,#141D36 0%,#1D2B4D 52%,#2B3C66 100%);--hdtxt:#F4F6FC;--hdsub:#B3C2E0;--hdglass:rgba(255,255,255,.12);
--pillon:#FFE08A;--pillontxt:#243B5E;
--hdsun:radial-gradient(circle at 38% 38%,#FFFBE0 0 40%,#FFF2B2 41%);--hdring:0 0 0 10px rgba(255,242,178,.12),0 0 0 22px rgba(255,242,178,.06);
--hdcloud:radial-gradient(circle at 20px 18px,#fff 0 1.3px,transparent 1.8px),radial-gradient(circle at 70px 44px,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 110px 12px,#fff 0 1.4px,transparent 1.9px),radial-gradient(circle at 150px 38px,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 40px 70px,#fff 0 1.1px,transparent 1.6px);--cloudop:.7;
--s1:#332F1C;--s2:#1F2C4A;--s4:#19233D;--stin:#3E3A1F;--stout:#243556;--glass2:rgba(255,255,255,.06);--pillbg:rgba(255,255,255,.09);--warnbg:#3E3A1F;--warntx:#FFE08A;--btnx:#2A1710;--t-utang:#F0A98A;--t-piutang:#8FD0A4;--t-tagihan:#F2C14E;--t-tabungan:#8FB5E2;--t-investasi:#B9A7E0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:108px}
#app{max-width:480px;margin:0 auto}
.serif{font-family:var(--serif)}
.hd{position:relative;overflow:hidden;background:var(--hdbg);color:var(--hdtxt);padding:16px 18px 26px;border-radius:0 0 40px 40px}
.hd.tall{padding-bottom:62px}
.hd>*{position:relative;z-index:1}
.hd::before{content:"";position:absolute;right:30px;top:62px;width:56px;height:56px;border-radius:50%;background:var(--hdsun);box-shadow:var(--hdring);z-index:0}
.hd::after{content:"";position:absolute;right:-30px;top:128px;width:150px;height:80px;background:var(--hdcloud);opacity:var(--cloudop);z-index:0;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--hdsub)}
.ttl{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:-.3px;color:var(--hdtxt);margin:14px 0 2px}
.hsub{font-size:13px;color:var(--hdsub)}
.big{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.big span{font-family:var(--serif);font-size:22px;color:var(--hdsub)}
.big input{flex:1;min-width:0;border:0;background:transparent;color:var(--hdtxt);font-family:var(--serif);font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.2;padding:0;outline:none}
.big input::placeholder{color:var(--hdsub);opacity:.55}
.err{min-height:18px;font-size:13px;color:var(--out);font-weight:500}
.pills{display:flex;gap:4px;background:var(--hdglass);border-radius:22px;padding:4px;margin-top:6px}
.pill{flex:1;border:0;background:transparent;color:var(--hdsub);border-radius:18px;padding:9px 4px;font:inherit;cursor:pointer}
.pill.on{background:var(--pillon);color:var(--pillontxt);font-weight:600}
.bd{padding:6px 18px 18px}
.lab{font-size:12.5px;font-weight:600;color:var(--mut);margin:18px 2px 8px;letter-spacing:.01em}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip,.cat{border:1px solid transparent;background:var(--bt);color:var(--fg);font:inherit;cursor:pointer}
.chip{flex:1 1 28%;padding:11px 6px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:13px 2px 11px;font-size:12.5px;border-radius:20px;background:var(--paper);box-shadow:var(--sh)}
.cat b{font-size:21px;line-height:1;display:grid;place-items:center;width:42px;height:42px;border-radius:15px;background:var(--bt);font-weight:400}
.cat:nth-child(even) b{background:var(--soft)}
.on.chip{background:var(--on);border-color:var(--on);color:#fff;font-weight:600}
.on.cat{background:var(--soft);border-color:var(--sun);box-shadow:0 0 0 2px var(--sun),var(--sh);font-weight:600}
.on.cat b{background:var(--paper)}
.in{width:100%;box-sizing:border-box;height:46px;border:1px solid var(--bl);border-radius:16px;background:var(--paper);color:var(--fg);padding:0 14px;font:inherit;font-size:16px}
.in:focus{outline:2px solid var(--b);outline-offset:0}
.btn{display:block;width:100%;border:0;border-radius:999px;background:linear-gradient(135deg,#7FA8D6,#3D6AA5);color:#fff;font-size:16px;font-weight:600;font-family:inherit;padding:15px;margin-top:22px;cursor:pointer;box-shadow:0 8px 18px rgba(61,106,165,.3)}
.btn.sec{background:transparent;color:var(--b);border:1.5px solid var(--b);margin-top:12px;font-size:14px;padding:11px;box-shadow:none;font-weight:500}
.btn.dg{background:var(--out);color:var(--btnx);box-shadow:none}
.ok{text-align:center;color:var(--in);font-size:14px;min-height:20px;margin-top:10px}
.warn{background:var(--warnbg);color:var(--warntx);font-size:13px;padding:9px 18px}
.hint{font-size:13px;margin-top:10px;background:var(--soft);border-radius:14px;padding:9px 12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--sh);border:1px solid var(--line)}
.card small{display:block;color:var(--mut);font-size:12px}
.card strong{font-size:17px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ic{width:38px;height:38px;border-radius:14px;background:var(--bt);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.rm{flex:1;min-width:0}.rm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm small{color:var(--mut)}
.amt{font-weight:600;white-space:nowrap}
.x{border:0;background:transparent;color:var(--mut);font-size:12px;font-family:inherit;cursor:pointer;padding:6px}
.bar{height:10px;border-radius:99px;background:var(--bt);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#A8C6E7,#7FA8D6 60%,#3D6AA5)}
.empty{text-align:center;color:var(--mut);padding:36px 0}
.krow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.krow .in{flex:1;min-width:0}
.krow .ic2{flex:none;width:50px;text-align:center;padding:0}
.krow .bg{flex:none;width:112px}
.note{font-size:12px;color:var(--mut);margin-top:16px}
.mon{height:38px;border:0;border-radius:14px;background:var(--hdglass);color:var(--hdtxt);padding:0 12px;font:inherit;font-weight:500;margin-top:10px}
nav{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border:1px solid var(--line);border-radius:30px;box-shadow:var(--navsh);padding:6px;z-index:5}
nav div{display:flex;gap:2px}
nav button{flex:1;border:0;background:transparent;color:var(--mut);font-size:11px;font-family:inherit;padding:7px 2px;border-radius:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;line-height:1;display:flex}
nav button.on{background:var(--soft);color:var(--fg);font-weight:600}
.pinbox{max-width:320px;margin:0 auto;padding:72px 24px 24px;text-align:center}
.pinbox .ic{background:linear-gradient(135deg,#A8C6E7,#3D6AA5);border-radius:50%}
.ttl2{font-family:var(--serif);font-size:26px;font-weight:600;margin-bottom:20px}
.pin{text-align:center;font-size:22px;letter-spacing:6px;height:52px}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--mut);margin-top:12px}
.err2{min-height:20px;color:var(--out);font-size:14px;margin-top:10px}
.pw{position:relative}.pw .in{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mut);cursor:pointer;padding:9px;display:flex}
.in.cd{text-align:center;letter-spacing:8px;font-size:22px;font-weight:700}
.lnk{background:none;border:0;color:var(--b);font:inherit;font-size:14px;cursor:pointer;margin-top:16px;text-decoration:underline}
@media (min-width:520px){body{background:var(--desk)}#app{background:var(--bg);min-height:100vh;box-shadow:0 0 0 1px var(--bl)}}
.topbtn{display:flex;align-items:center;gap:6px;border:0;background:var(--hdglass);color:var(--hdtxt);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.mini{border:1px solid var(--bl);background:var(--paper);color:var(--fg);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.mini.on{background:var(--on);border-color:var(--on);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:999px;background:var(--bt);color:var(--fg);margin-right:6px}
.grp{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--fg);font:inherit;font-weight:600;padding:16px 2px 6px;cursor:pointer;text-align:left}
.grp .gc{margin-left:auto;font-weight:500;color:var(--mut);font-size:13px;background:var(--bt);border-radius:999px;padding:1px 10px}
.dow{text-align:center;font-size:11px;font-weight:600;color:var(--mut);padding:2px 0}

/* Riwayat */
.rw-sub{font-size:13px;color:var(--hdsub);margin-top:2px}
.rw-bar{display:flex;gap:8px;margin-top:16px;align-items:center}
.rw-search{position:relative;flex:1;min-width:0}
.rw-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut);pointer-events:none}
.rw-search .in{padding-left:42px;border-radius:999px;background:var(--paper);border-color:transparent;box-shadow:var(--sh)}
.rw-dl{display:flex;align-items:center;gap:6px;height:46px;flex:none;border:0;border-radius:999px;background:var(--pillon);color:var(--pillontxt);font:inherit;font-size:14px;font-weight:600;padding:0 16px;cursor:pointer}
.rw-dl svg{width:18px;height:18px}
.rw-dl.off{background:var(--bt);color:var(--fg)}
.rw-kat{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:18px;background:var(--bt);color:var(--fg);font:inherit;padding:12px 15px;margin-top:10px;cursor:pointer;text-align:left}
.rw-kat small{color:var(--mut);font-size:13px}
.rw-kat b{font-weight:600;margin-left:auto}
.rw-kat i{font-style:normal;color:var(--mut);font-size:12px}
.rw-chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 2px 2px}
.rw-chip{border:1px solid var(--bl);background:var(--paper);color:var(--fg);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.rw-chip.on{background:var(--on);border-color:var(--on);color:#fff;font-weight:600}
.rw-cap{font-size:12px;color:var(--mut);margin:20px 4px 8px;min-height:1px}
.rw-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--sumbg);border-radius:24px;padding:15px 4px;box-shadow:var(--sh)}
.rw-sum>div{padding:0 12px;min-width:0}
.rw-sum>div+div{border-left:1px solid rgba(127,127,127,.25)}
.rw-sum small{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
.rw-sum small i{width:7px;height:7px;border-radius:50%;display:inline-block}
.rw-sum b{display:block;font-size:13.5px;white-space:nowrap;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.rw-day{margin-top:20px}
.rw-dh{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:0 4px 8px}
.rw-dh b{display:block;font-family:var(--serif);font-size:17px;font-weight:600}
.rw-dh small{color:var(--mut);font-size:12px;white-space:nowrap}.rw-dh>div:first-child{flex:none}
.rw-pills{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.rw-p{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.rw-p.o{background:var(--outbg);color:var(--out)}
.rw-p.i{background:var(--inbg);color:var(--in)}
.rw-list{background:var(--paper);border-radius:24px;padding:2px 14px;box-shadow:var(--sh);border:1px solid var(--line)}
.rw-row{display:flex;align-items:center;gap:12px;padding:13px 0}
.rw-row+.rw-row{border-top:1px solid var(--line)}
.rw-ic{width:42px;height:42px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:var(--bt)}
.rw-ic.o{background:var(--soft)}
.rw-ic.i{background:var(--bt)}
.rw-m{flex:1;min-width:0}
.rw-k{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw-tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:999px;background:var(--bt);color:var(--b);margin-top:3px}
.rw-n{font-size:12px;color:var(--mut);margin-top:4px;overflow-wrap:anywhere;line-height:1.35}
.rw-r{text-align:right;flex:none}
.rw-a{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.rw-a em{font-style:normal;font-weight:400;font-size:11px;opacity:.7;margin-right:2px}
.rw-a.o{color:var(--out)}.rw-a.i{color:var(--in)}.rw-a.t{color:var(--mut)}
.rw-x{border:0;background:transparent;color:var(--mut);font:inherit;font-size:11.5px;cursor:pointer;padding:7px 0 0;display:inline-flex;align-items:center;gap:3px}
.rw-x svg{width:13px;height:13px}
.rw-x.ask{color:var(--out);font-weight:600}
.rw-empty{text-align:center;color:var(--mut);padding:44px 12px 30px;line-height:1.5}
.rw-empty span{display:block;font-size:38px;margin-bottom:6px}
.rw-empty b{display:block;color:var(--fg);font-weight:600;margin-bottom:2px}
.rw-panel{margin-top:12px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--sh);border-radius:24px;padding:14px 16px 16px}
.rw-seg{display:flex;gap:4px;background:var(--segbg);border-radius:999px;padding:4px;margin-top:12px}
.rw-seg button{flex:1;border:0;background:transparent;color:var(--mut);font:inherit;font-size:13.5px;border-radius:999px;padding:9px 4px;cursor:pointer}
.rw-seg button.on{color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.rw-seg button.semua.on{background:var(--on)}.rw-seg button.in.on{background:#3F8A5A}.rw-seg button.out.on{background:#C4573A}

/* Ringkasan */
.rs-bal{font-size:44px;font-weight:700;letter-spacing:-1.5px;line-height:1.05;margin-top:2px}
.rs-bal s{text-decoration:none;font-size:20px;font-weight:500;color:var(--hdsub);margin-right:5px;letter-spacing:0}
.rs-up{display:inline-flex;gap:6px;margin-top:10px;background:var(--pillbg);border-radius:99px;padding:5px 12px;font-size:12.5px}
.rs-st{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:-38px 16px 0;position:relative;z-index:2}
.rs-c{border-radius:26px;padding:15px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.rs-c::after{content:"";position:absolute;right:-18px;bottom:-22px;width:80px;height:80px;border-radius:50%;background:var(--glass2)}
.rs-c.i{background:var(--stin)}.rs-c.o{background:var(--stout)}
.rs-c .r{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);position:relative;z-index:1}
.rs-ar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--paper)}
.rs-c b{display:block;font-size:19px;margin-top:10px;font-weight:700;position:relative;z-index:1}

  navEl.parentNode.style.display="";
  navEl.innerHTML=T.map(function(t){return '<button class="'+(S.tab===t[0]?"on":"")+'" data-t="'+t[0]+'"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join("");
}
navEl.onclick=function(e){var t=e.target.closest("[data-t]");if(!t)return;if(S.tab==="kelola"&&t.dataset.t!=="kelola"){if(dupBad()){S.kmsg="Nama tidak boleh kosong atau kembar dalam satu daftar.";render();return}["akun","out","in"].forEach(function(j){KAT[j].forEach(function(k){k.n=k.n.trim()})});saveCfg()}S.tab=t.dataset.t;S.del=null;S.rsAsk=false;S.rmsg="";S.orAsk=false;fixKat();S.msg="";S.err="";render();window.scrollTo(0,0)};
app.oninput=function(e){
  if(e.target.dataset.c){var p=e.target.dataset.c.split("|"),k=KAT[p[0]][Number(p[1])];if(!k)return;if(p[2]==="b"){var d=e.target.value.replace(/\D/g,"").slice(0,12);e.target.value=d?Number(d).toLocaleString("id-ID"):"";k.b=Number(d)||0}else if(p[2]==="n")k.n=e.target.value;else k.i=e.target.value;saveCfg();return}
  if(xinput(e))return;var id=e.target.id;
  if(id==="nom"){var d=e.target.value.replace(/\D/g,"").slice(0,12);e.target.value=d?Number(d).toLocaleString("id-ID"):"";S.nom=e.target.value;S.err="";S.msg=""}
  else if(id==="fee"){fmtIn(e.target);S.fee=e.target.value}
  else if(id==="ket")S.ket=e.target.value;
  else if(id==="tgl"&&e.target.value)S.tgl=e.target.value;
  else if(id==="bln"&&e.target.value){S.bulan=e.target.value;S.selDay="";if(S.rd){S.rd.from=S.bulan+"-01";S.rd.to=lastDay(S.bulan);S.rd.msg=""}render()}
};
app.onkeydown=function(e){if(e.key==="Enter"&&e.target.id==="fp_email"){fpSend();return}if(e.key==="Enter"&&e.target.id==="fp_code"){fpVerify();return}if(e.key==="Enter"&&e.target.id==="pin"){PIN=e.target.value;S.rem=!!(document.getElementById("rem")||{}).checked;if(PIN)doLogin()}};
app.onclick=function(e){
  var t=e.target.closest("[data-a]");if(!t)return;var a=t.dataset.a,v=t.dataset.v;if(extra(a,v,t))return;
  if(a==="jenis"){S.jenis=v;if(v!=="tf")S.kat=KAT[v].length?KAT[v][0].n:"";S.err="";S.msg="";fixKat();render()}
  else if(a==="akun"){S.akun=v;fixKat();render()}
  else if(a==="kat"){S.kat=v;render()}
  else if(a==="simpan")simpan();
  else if(a==="del"){if(S.del===v)hapus(v);else{S.del=v;render()}}
  else if(a==="login"){PIN=(document.getElementById("pin")||{}).value||"";S.rem=!!(document.getElementById("rem")||{}).checked;if(PIN)doLogin()}
  else if(a==="auto"){var on=v==="1";S.auto=on;S.bmsg="";render();call("api_setAuto",on,S.autoDay).then(function(){S.bmsg=on?"Cadangan otomatis aktif.":"Cadangan otomatis dimatikan.";render()}).catch(function(e){S.auto=!on;S.bmsg=msg(e);render()})}
  else if(a==="backup"){if(S.busy)return;S.busy="backup";S.bmsg="";render();call("api_backup").then(function(r){S.last=r.last;S.bmsg="Tersimpan di folder Drive: "+r.folder+"."}).catch(function(e){S.bmsg=msg(e)}).then(function(){S.busy="";render()})}
  else if(a==="eye"){var ip=document.getElementById(v),show=ip.type==="password";ip.type=show?"text":"password";t.innerHTML=show?EYEOFF:EYE;t.setAttribute("aria-label",show?"Sembunyikan PIN":"Tampilkan PIN")}
  else if(a==="forgot"){S.forgot=true;S.fp={step:"email",email:"",err:"",busy:false,hint:S.fp.hint||""};render()}
  else if(a==="fp_send"||a==="fp_resend")fpSend();
  else if(a==="fp_verify")fpVerify();
  else if(a==="back"){S.forgot=false;render()}
  else if(a==="chpin"){var op=(document.getElementById("opin")||{}).value||"",np=(document.getElementById("npin")||{}).value||"",np2=(document.getElementById("npin2")||{}).value||"";
    if(!op){S.pmsg="Isi PIN lama dulu.";render();return}
    if(!/^\d{4,12}$/.test(np)){S.pmsg="PIN baru harus 4 sampai 12 angka.";render();return}
    if(np!==np2){S.pmsg="PIN baru dan ulangannya tidak sama.";render();return}
    if(np===op){S.pmsg="PIN baru harus berbeda dari PIN lama.";render();return}
    S.pmsg="Memproses…";render();
    call("api_changePin",op,np).then(function(){PIN=np;try{if(S.rem)localStorage.setItem("pk_pin",np)}catch(x){}S.pmsg="PIN diganti."}).catch(function(e){S.pmsg=(e&&e.message||"").indexOf("BADPIN")>=0?"PIN lama salah.":msg(e)}).then(function(){render()})}
  else if(a==="lock"){PIN="";S.rem=false;S.auth=false;S.tx=[];S.utang=[];S.aset=[];S.log=[];try{localStorage.removeItem("pk_pin")}catch(x){}render()}
  else if(a==="addkat"){if(KAT[v].length>=LIM[v]){S.kmsg="Batas "+LIM[v]+" sudah tercapai.";render();return}KAT[v].push({n:"Baru",i:v==="akun"?"":"•",b:0});S.kmsg="";fixKat();saveCfg();render()}
  else if(a==="kelola"){if(S.tab!=="kelola")S.prev=S.tab;S.tab="kelola";S.del=null;S.kmsg="";render();window.scrollTo(0,0)}
  else if(a==="tutup"){if(dupBad()){S.kmsg="Nama tidak boleh kosong atau kembar dalam satu daftar.";render();return}["akun","out","in"].forEach(function(j){KAT[j].forEach(function(k){k.n=k.n.trim()})});saveCfg();S.tab=S.prev||"catat";S.del=null;S.kmsg="";fixKat();render();window.scrollTo(0,0)}
  else if(a==="delkat"){if(S.del===v){var p=v.split("|");if(p[0]==="akun"&&KAT.akun.length<=1){S.del=null;S.kmsg="Minimal harus ada satu akun.";render();return}KAT[p[0]].splice(Number(p[1]),1);S.del=null;S.kmsg="";fixKat();saveCfg();render()}else{S.del=v;S.kmsg="";render()}}
};
function simpan(){if(S.jenis==="tf")return simpanTf();
  var n=Number(S.nom.replace(/\D/g,""));
  if(!n){S.err="Isi nominal dulu";S.msg="";render();return}
  if(!S.kat){S.err="Pilih kategori dulu";S.msg="";render();return}
  var r={tgl:S.tgl,jenis:S.jenis,akun:S.akun,kat:S.kat,nom:n,ket:S.ket.trim(),ts:Date.now()};
  S.nom="";S.ket="";S.err="";S.msg="Tersimpan: "+rp(n);
  r.id="t"+r.ts.toString(36)+Math.random().toString(36).slice(2,5);S.tx.push(r);
  call("api_add",r).catch(function(e){S.tx=S.tx.filter(function(t){return t!==r});S.msg="";S.err="Gagal menyimpan: "+msg(e);render()});
  render();
}
function hapus(id){
  S.del=null;
  var t0=S.tx.filter(function(t){return t.id===id})[0],ids=[id];
  if(t0&&t0.src==="transfer")ids=S.tx.filter(function(t){return t.ref===t0.ref&&(t.src==="transfer"||t.src==="transferfee")}).map(function(t){return t.id});
  var olds=S.tx.filter(function(t){return ids.indexOf(t.id)>=0});
  S.tx=S.tx.filter(function(t){return ids.indexOf(t.id)<0});
  Promise.all(ids.map(function(i){return call("api_delete",i)})).catch(function(e){S.tx=S.tx.concat(olds);S.err=msg(e);S.dbErr=true;render()});
  render();
}
render();
themeMeta();try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",themeMeta)}catch(e){}
try{var sp=localStorage.getItem("pk_pin");if(sp){PIN=sp;S.rem=true;doLogin(true)}}catch(x){}
call("api_info").then(function(r){if(r&&r.hint){S.fp.hint=r.hint;if(S.forgot)render()}}).catch(function(){});
</script>
</body></html>
